<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Dashboard</title>
<style>
  :root {
    --bg: #faf9f7;
    --panel: #ffffff;
    --border: #e7e3dc;
    --ink: #1f2328;
    --ink-muted: #5b6470;
    --ink-faint: #94a0ac;
    --accent: #b3541e;
    --accent-soft: #f4e3d3;
    --line-total: #263142;
    --bar-neutral: #a9b4c2;
    --grid: #ece8e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .dashboard {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 28px 80px;
  }
  header.page-head {
    margin-bottom: 32px;
  }
  header.page-head h1 {
    font-size: 26px;
    font-weight: 650;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  header.page-head p {
    margin: 0;
    color: var(--ink-muted);
    font-size: 14px;
  }
  header.page-head p.freshness {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-faint);
  }
  section {
    margin-bottom: 40px;
  }
  section h2 {
    font-size: 14px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    margin: 0 0 16px;
  }
  .verdict-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .tile .label {
    font-size: 12px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .tile .value {
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .tile .sub {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .tile .value.flag { color: var(--accent); }
  .tile .sub.flag { color: var(--accent); font-weight: 600; }

  .change-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .change-badge.bad { background: var(--accent-soft); color: var(--accent); }
  .change-badge.good { background: #eef0f2; color: var(--ink); }
  .change-badge.flat { background: #eef0f2; color: var(--ink-muted); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  svg { display: block; width: 100%; height: auto; }
  .axis-label, .month-label { font-size: 11px; fill: var(--ink-faint); }
  .value-label { font-size: 12px; fill: var(--ink); font-weight: 600; }
  .value-label.accent { fill: var(--accent); }
  .gridline { stroke: var(--grid); stroke-width: 1; }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 7px; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; }
  .swatch.dotted { width: 16px; height: 0; background: none; border-top: 3px dotted var(--accent); }

  .bar-name { font-size: 13px; fill: var(--ink); }
  .bar-value { font-size: 13px; fill: var(--ink-muted); font-weight: 600; }
  .bar-value.accent { fill: var(--accent); font-weight: 650; }

  .table-controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  select {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    font-weight: 650;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
  }
  thead th.amount-col {
    text-align: right;
    cursor: pointer;
    user-select: none;
  }
  thead th.amount-col:hover { color: var(--ink); }
  tbody td {
    padding: 10px;
    border-bottom: 1px solid var(--grid);
    vertical-align: top;
  }
  tbody tr:nth-child(even) { background: #fbfaf8; }
  td.amount-col { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.notes-col { color: var(--ink-muted); font-size: 13px; }
  .missing-badge {
    font-size: 11px;
    color: var(--ink-faint);
    font-style: italic;
  }
  .empty-row td {
    text-align: center;
    color: var(--ink-faint);
    padding: 24px 10px;
  }
  .data-quality-panel {
    background: #f3f1ec;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 32px;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .dq-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .dq-list {
    margin: 0;
    padding-left: 18px;
  }
  .dq-list li {
    margin-bottom: 5px;
    line-height: 1.5;
  }
  .dq-list li:last-child { margin-bottom: 0; }
  .dq-list strong { color: var(--ink); }
  .flag-icon {
    color: var(--ink-faint);
    font-size: 11px;
    margin-right: 3px;
  }
  .dup-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-muted);
    background: #eef0f2;
    border-radius: 999px;
    padding: 1px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div class="dashboard">

  <header class="page-head">
    <h1>Expense Dashboard</h1>
    <p id="rangeSubtitle">Loading…</p>
    <p class="freshness" id="freshnessLine"></p>
  </header>

  <div class="data-quality-panel" id="dataQualityPanel"></div>

  <section class="verdict-strip" id="verdictStrip"></section>

  <section>
    <h2>Monthly Spend Trend</h2>
    <div class="panel">
      <svg id="trendChart" viewBox="0 0 820 300"></svg>
      <div class="legend" id="trendLegend"></div>
    </div>
  </section>

  <section>
    <h2>Spend by Category</h2>
    <div class="panel">
      <svg id="categoryChart"></svg>
    </div>
  </section>

  <section>
    <h2>All Expenses</h2>
    <div class="panel">
      <div class="table-controls">
        <select id="categoryFilter"></select>
        <select id="monthFilter"></select>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Vendor</th>
            <th>Category</th>
            <th class="amount-col" id="amountHeader">Amount <span id="sortArrow"></span></th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

</div>

<script>
const CSV_DATA = `Date,Vendor,Category,Amount,Notes

2026-01-09,WeWork,Office Rent,2400.00,

2026-05-28,WeWork,Office Rent,2400.00,offsite planning
2026-05-13,Canva,Software,54.99,
2026-05-08,Google Ads,Marketing,593.00,
2026-05-22,Mailchimp,Software,60.00,
2026-05-28,Canva,Software,55.00,check w/ finance
2026-06-15,Uber,Travel,19.50,
2026-06-08,Delta Airlines,Travel,449.00,conf travel
2026-06-15,Staples,Office Supplies,89.45,
2026-06-13,WeWork,Office Rent,2400.00,renewal
2026-06-09,Marriott,Travel,584.00,offsite planning
2026-06-27,Delta Airlines,Travel,485.65,
2026-06-14,LinkedIn,Software,60.00,conf travel
2026-06-15,Marriott,Travel,523.03,
2026-06-01,Mailchimp,Software,60.00,
2026-06-08,Zoom,Software,149.90,reimbursed?
2026-06-15,Marriott,Travel,731.70,`;

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim().length > 0);
  const rows = lines.slice(1).map(line => {
    const parts = line.split(',');
    const date = parts[0].trim();
    const vendor = parts[1].trim();
    const category = parts[2].trim();
    const amountRaw = parts[3].trim();
    const notes = parts.slice(4).join(',').trim();
    return {
      date,
      month: date.slice(0, 7),
      vendor,
      category,
      amount: amountRaw === '' ? null : parseFloat(amountRaw),
      notes
    };
  });
  return rows;
}

const DATA = parseCSV(CSV_DATA);

const currency = v => v.toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 });
const currencyPrecise = v => v.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
const monthLabel = m => {
  const [y, mo] = m.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(mo, 10) - 1] + ' ' + y;
};
const monthShort = m => monthLabel(m).split(' ')[0];

const months = [...new Set(DATA.map(d => d.month))].sort();
const categories = [...new Set(DATA.map(d => d.category))];

const monthlyTotals = {};
months.forEach(m => monthlyTotals[m] = 0);
DATA.forEach(d => { monthlyTotals[d.month] += d.amount || 0; });

const categoryMonthly = {};
categories.forEach(c => { categoryMonthly[c] = {}; months.forEach(m => categoryMonthly[c][m] = 0); });
DATA.forEach(d => { categoryMonthly[d.category][d.month] += d.amount || 0; });

const categoryTotals = categories
  .map(c => ({ name: c, total: months.reduce((s, m) => s + categoryMonthly[c][m], 0) }))
  .sort((a, b) => b.total - a.total);

const latestMonth = months[months.length - 1];
const priorMonth = months.length > 1 ? months[months.length - 2] : null;

let fastestGrowing = null;
if (priorMonth) {
  let best = null;
  categories.forEach(c => {
    const delta = categoryMonthly[c][latestMonth] - categoryMonthly[c][priorMonth];
    if (!best || delta > best.delta) best = { name: c, delta, latest: categoryMonthly[c][latestMonth], prior: categoryMonthly[c][priorMonth] };
  });
  fastestGrowing = best;
}

const grandTotal = months.reduce((s, m) => s + monthlyTotals[m], 0);

document.getElementById('rangeSubtitle').textContent =
  `${monthLabel(months[0])} – ${monthLabel(months[months.length - 1])} · ${currencyPrecise(grandTotal)} total spend across ${DATA.length} expenses`;
document.getElementById('freshnessLine').textContent = `Data through ${monthLabel(latestMonth)}`;

const FLAG_PATTERN = /\?|needs receipt|check w\/|missing|pending|tbd|verify|reimbursed/i;
const isFlaggedNote = notes => !!notes && FLAG_PATTERN.test(notes);

const missingAmountRows = DATA.filter(d => d.amount === null);
const flaggedRows = DATA.filter(d => d.amount !== null && isFlaggedNote(d.notes));
const flaggedTotal = flaggedRows.reduce((s, d) => s + d.amount, 0);

const dupKeyCounts = {};
DATA.forEach(d => {
  const key = `${d.vendor}|${d.date}|${d.category}`;
  dupKeyCounts[key] = (dupKeyCounts[key] || 0) + 1;
});
const duplicateGroups = Object.keys(dupKeyCounts)
  .filter(key => dupKeyCounts[key] > 1)
  .map(key => {
    const [vendor, date] = key.split('|');
    return { vendor, date };
  });
const isDuplicateRow = d => dupKeyCounts[`${d.vendor}|${d.date}|${d.category}`] > 1;

function renderDataQuality() {
  const panel = document.getElementById('dataQualityPanel');
  const items = [];

  if (missingAmountRows.length > 0) {
    const examples = missingAmountRows.slice(0, 3).map(d => `${d.vendor}, ${d.date}`).join('; ');
    items.push(`<strong>${missingAmountRows.length}</strong> expense${missingAmountRows.length === 1 ? '' : 's'} missing an amount (${examples}${missingAmountRows.length > 3 ? ', …' : ''}) — excluded from every total and chart on this page.`);
  }

  if (flaggedRows.length > 0) {
    items.push(`<strong>${flaggedRows.length}</strong> expense${flaggedRows.length === 1 ? '' : 's'} totaling <strong>${currencyPrecise(flaggedTotal)}</strong> ${flaggedRows.length === 1 ? 'is' : 'are'} flagged in Notes as unverified (e.g. "reimbursed?", "check w/ finance", "needs receipt") — counted in totals at face value, marked with ⚑ in the table below.`);
  }

  if (duplicateGroups.length > 0) {
    const list = duplicateGroups.map(g => `${g.vendor} on ${g.date}`).join('; ');
    items.push(`<strong>${duplicateGroups.length}</strong> possible duplicate charge${duplicateGroups.length === 1 ? '' : 's'} — same vendor, date, and category logged more than once: ${list}. Worth confirming these aren't billing errors before trusting the totals above.`);
  }

  if (items.length === 0) {
    panel.style.display = 'none';
    return;
  }

  panel.innerHTML = `<div class="dq-title">Data quality notes</div><ul class="dq-list">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
}

function renderVerdictStrip() {
  const strip = document.getElementById('verdictStrip');
  const pctChange = priorMonth ? ((monthlyTotals[latestMonth] - monthlyTotals[priorMonth]) / monthlyTotals[priorMonth]) * 100 : null;
  const isUp = pctChange !== null && pctChange > 0;
  const isDown = pctChange !== null && pctChange < 0;

  let badgeClass = 'flat', arrow = '→', word = 'Flat';
  if (isUp) { badgeClass = 'bad'; arrow = '▲'; word = 'Worse'; }
  else if (isDown) { badgeClass = 'good'; arrow = '▼'; word = 'Better'; }

  const tile1 = `
    <div class="tile">
      <div class="label">Total spend &middot; ${monthLabel(latestMonth)}</div>
      <div class="value">${currencyPrecise(monthlyTotals[latestMonth])}</div>
      <div class="sub">Prior month: ${priorMonth ? currencyPrecise(monthlyTotals[priorMonth]) : '—'}</div>
    </div>`;

  const tile2 = `
    <div class="tile">
      <div class="label">Vs. last month</div>
      <div class="value"><span class="change-badge ${badgeClass}">${pctChange === null ? '—' : `${arrow} ${Math.abs(pctChange).toFixed(0)}% ${word}`}</span></div>
      <div class="sub">${pctChange === null ? 'No prior month to compare' : isUp ? 'Spend increased vs. last month' : isDown ? 'Spend decreased vs. last month' : 'No change vs. last month'}</div>
    </div>`;

  const tile3 = `
    <div class="tile">
      <div class="label">Fastest-growing category</div>
      <div class="value flag">${fastestGrowing ? fastestGrowing.name : '—'}</div>
      <div class="sub flag">${fastestGrowing ? '+' + currencyPrecise(fastestGrowing.delta) + ' vs. prior month' : ''}</div>
    </div>`;

  strip.innerHTML = tile1 + tile2 + tile3;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function renderTrendChart() {
  const svg = document.getElementById('trendChart');
  svg.innerHTML = '';
  const width = 820, height = 300;
  const padL = 60, padR = 24, padT = 20, padB = 36;
  const plotW = width - padL - padR;
  const plotH = height - padT - padB;

  const totalSeries = months.map(m => monthlyTotals[m]);
  const catName = fastestGrowing ? fastestGrowing.name : null;
  const catSeries = catName ? months.map(m => categoryMonthly[catName][m]) : [];

  const maxVal = Math.max(...totalSeries, ...catSeries, 1) * 1.15;
  const xStep = months.length > 1 ? plotW / (months.length - 1) : 0;
  const xScale = i => padL + i * xStep;
  const yScale = v => padT + plotH - (v / maxVal) * plotH;

  const gridSteps = 4;
  for (let i = 0; i <= gridSteps; i++) {
    const val = (maxVal / gridSteps) * i;
    const y = yScale(val);
    svg.appendChild(svgEl('line', { x1: padL, x2: width - padR, y1: y, y2: y, class: 'gridline' }));
    const label = svgEl('text', { x: padL - 10, y: y + 4, class: 'axis-label', 'text-anchor': 'end' });
    label.textContent = currency(val);
    svg.appendChild(label);
  }

  months.forEach((m, i) => {
    const label = svgEl('text', { x: xScale(i), y: height - 12, class: 'month-label', 'text-anchor': 'middle' });
    label.textContent = monthShort(m);
    svg.appendChild(label);
  });

  if (totalSeries.length > 1) {
    const baseline = yScale(0);
    const areaPoints = totalSeries.map((v, i) => `${xScale(i)},${yScale(v)}`).join(' ');
    const areaPath = `${xScale(0)},${baseline} ${areaPoints} ${xScale(totalSeries.length - 1)},${baseline}`;
    svg.appendChild(svgEl('polygon', { points: areaPath, fill: '#263142', 'fill-opacity': 0.06, stroke: 'none' }));
  }

  function drawSeries(series, opts) {
    const points = series.map((v, i) => `${xScale(i)},${yScale(v)}`).join(' ');
    const attrs = { points, fill: 'none', stroke: opts.color, 'stroke-width': opts.width, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
    if (opts.dash) attrs['stroke-dasharray'] = opts.dash;
    svg.appendChild(svgEl('polyline', attrs));
    series.forEach((v, i) => {
      if (opts.hollow) {
        svg.appendChild(svgEl('circle', { cx: xScale(i), cy: yScale(v), r: opts.r, fill: '#ffffff', stroke: opts.color, 'stroke-width': 2 }));
      } else {
        svg.appendChild(svgEl('circle', { cx: xScale(i), cy: yScale(v), r: opts.r, fill: opts.color, stroke: '#ffffff', 'stroke-width': 1.5 }));
      }
    });
  }

  drawSeries(totalSeries, { color: '#263142', width: 3, r: 5, hollow: false });
  if (catName) drawSeries(catSeries, { color: '#b3541e', width: 2, dash: '1,7', r: 4, hollow: true });

  const peakIdx = totalSeries.indexOf(Math.max(...totalSeries));
  const labelPoints = new Set([0, totalSeries.length - 1, peakIdx]);
  labelPoints.forEach(i => {
    const v = totalSeries[i];
    const t = svgEl('text', { x: xScale(i), y: yScale(v) - 12, class: 'value-label', 'text-anchor': 'middle' });
    t.textContent = currency(v);
    svg.appendChild(t);
  });

  if (catName) {
    const lastIdx = catSeries.length - 1;
    const t = svgEl('text', { x: xScale(lastIdx), y: yScale(catSeries[lastIdx]) - 12, class: 'value-label accent', 'text-anchor': 'middle' });
    t.textContent = currency(catSeries[lastIdx]);
    svg.appendChild(t);
  }

  const legend = document.getElementById('trendLegend');
  legend.innerHTML = `
    <div class="legend-item"><span class="swatch" style="background:#263142"></span>Total spend</div>
    ${catName ? `<div class="legend-item"><span class="swatch dotted"></span>${catName} (fastest growing)</div>` : ''}
  `;
}

function renderCategoryChart() {
  const svg = document.getElementById('categoryChart');
  const barHeight = 28, gap = 18;
  const padL = 150, padR = 90, padTop = 10;
  const width = 820;
  const plotW = width - padL - padR;
  const height = padTop * 2 + categoryTotals.length * (barHeight + gap) - gap;
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.innerHTML = '';

  const maxVal = categoryTotals[0].total;

  categoryTotals.forEach((cat, i) => {
    const y = padTop + i * (barHeight + gap);
    const barW = (cat.total / maxVal) * plotW;
    const isAccent = fastestGrowing && cat.name === fastestGrowing.name;

    svg.appendChild(svgEl('rect', {
      x: padL, y, width: Math.max(barW, 2), height: barHeight, rx: 5,
      fill: isAccent ? '#b3541e' : '#a9b4c2'
    }));

    const nameLabel = svgEl('text', { x: padL - 12, y: y + barHeight / 2 + 4, class: 'bar-name', 'text-anchor': 'end' });
    nameLabel.textContent = cat.name;
    svg.appendChild(nameLabel);

    const valueLabel = svgEl('text', { x: padL + barW + 10, y: y + barHeight / 2 + 4, class: `bar-value ${isAccent ? 'accent' : ''}` });
    valueLabel.textContent = currencyPrecise(cat.total);
    svg.appendChild(valueLabel);
  });
}

let sortDir = null;
let filterCategory = 'all';
let filterMonth = 'all';

function populateFilters() {
  const catSelect = document.getElementById('categoryFilter');
  catSelect.innerHTML = '<option value="all">All Categories</option>' +
    categories.map(c => `<option value="${c}">${c}</option>`).join('');
  catSelect.addEventListener('change', e => { filterCategory = e.target.value; renderTable(); });

  const monthSelect = document.getElementById('monthFilter');
  monthSelect.innerHTML = '<option value="all">All Months</option>' +
    months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
  monthSelect.addEventListener('change', e => { filterMonth = e.target.value; renderTable(); });

  document.getElementById('amountHeader').addEventListener('click', () => {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
    renderTable();
  });
}

function renderTable() {
  document.getElementById('sortArrow').textContent = sortDir === 'asc' ? '▲' : sortDir === 'desc' ? '▼' : '';

  let rows = DATA.filter(d =>
    (filterCategory === 'all' || d.category === filterCategory) &&
    (filterMonth === 'all' || d.month === filterMonth)
  );

  if (sortDir) {
    rows = [...rows].sort((a, b) => {
      const av = a.amount === null ? -1 : a.amount;
      const bv = b.amount === null ? -1 : b.amount;
      return sortDir === 'asc' ? av - bv : bv - av;
    });
  }

  const tbody = document.getElementById('tableBody');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No expenses match these filters.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(d => {
    const flagged = d.amount !== null && isFlaggedNote(d.notes);
    const dup = isDuplicateRow(d);
    return `
    <tr>
      <td>${d.date}${dup ? '<span class="dup-badge" title="Same vendor, date, and category logged more than once">dup?</span>' : ''}</td>
      <td>${d.vendor}</td>
      <td>${d.category}</td>
      <td class="amount-col">${d.amount === null ? '<span class="missing-badge">missing</span>' : currencyPrecise(d.amount)}</td>
      <td class="notes-col">${flagged ? '<span class="flag-icon" title="Flagged for follow-up">⚑</span>' : ''}${d.notes || ''}</td>
    </tr>
  `;
  }).join('');
}

renderDataQuality();
renderVerdictStrip();
renderTrendChart();
renderCategoryChart();
populateFilters();
renderTable();
</script>
